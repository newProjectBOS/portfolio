server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # js/css z vite mają hash w nazwie, więc można je cache'ować na stałe
    # (reszta /assets/ pochodzi z public/ i nie ma hasha)
    location ~* ^/assets/.+\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html zawsze świeży, żeby po deployu od razu wczytał nowe assety
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # BrowserRouter - ścieżki typu /admin/panel obsługuje React, nie nginx
    location / {
        try_files $uri $uri/ /index.html;
    }
}
